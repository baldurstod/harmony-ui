<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Test tooltip</title>
	<link href="../assets/css/examples.css" rel="stylesheet">
	<style>
		body>div {
			flex: 1;
		}
	</style>
</head>

<body style="width:100%;height:100%;position:absolute;">
	<!--div id="target"></div-->
</body>
<script type="module">
	import { HarmonyPanel } from '../../dist/browser.js';

	const panel = new HarmonyPanel();
	document.body.append(panel.htmlElement);

	const panels = [];
	for (let i = 0; i < 3; i++) {
		const panel = new HarmonyPanel();
		panel.setTitle(i);
		panel.append(i);
		panels.push(panel)
	}


	panel.append(...panels);

</script>

</html>
